spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/ajoledger}
    username: ${DATABASE_USERNAME:ajoledger}
    password: ${DATABASE_PASSWORD:ajoledger}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${HIBERNATE_SHOW_SQL:false}
    properties:
      hibernate:
        '[format_sql]': true

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

ajoledger:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000} # 15 min in milliseconds
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:2592000000} # 30 days in milliseconds
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Content-Type,Authorization,X-XSRF-TOKEN}
  security:
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
    lockout-duration-minutes: ${AUTH_LOCKOUT_MINUTES:15}
    secure-cookies: ${SECURE_COOKIES:false} # set true once the app is served over HTTPS
    cookie-domain: ${COOKIE_DOMAIN:} # e.g. ajoledger.xyz, needed once frontend and backend are on different subdomains
  google:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  scheduler:
    deadline-check-cron: ${DEADLINE_CHECK_CRON:0 0 0 * * *} # daily at 12am server time
    enrollment-close-cron: ${ENROLLMENT_CLOSE_CRON:0 0 0 * * *} # daily at 12am server time
    reconciliation-cron: ${RECONCILIATION_CRON:0 0 * * * *} # hourly
    reconciliation-lookback-hours: ${RECONCILIATION_LOOKBACK_HOURS:24}
    hash-chain-seal-cron: ${HASH_CHAIN_SEAL_CRON:0 * * * * *} # every minute
    email-outbox-cron: ${EMAIL_OUTBOX_CRON:*/5 * * * * *} # every 5 seconds, a verification email shouldn't feel delayed
    email-outbox-purge-cron: ${EMAIL_OUTBOX_PURGE_CRON:0 30 3 * * *} # daily at 3:30am server time
  stripe:
    api-key: ${STRIPE_API_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    connect-timeout-ms: ${STRIPE_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${STRIPE_READ_TIMEOUT_MS:15000} # SDK default is 80s, far too long to hold a checkout request open
    max-network-retries: ${STRIPE_MAX_NETWORK_RETRIES:2} # SDK default; safe since checkout session creation already carries an idempotency key
  paypal:
    client-id: ${PAYPAL_CLIENT_ID}
    client-secret: ${PAYPAL_CLIENT_SECRET}
    environment: ${PAYPAL_ENVIRONMENT:SANDBOX}
    timeout-ms: ${PAYPAL_TIMEOUT_MS:15000}
    uncaptured-grace-minutes: ${PAYPAL_UNCAPTURED_GRACE_MINUTES:30} # must exceed how long a legitimate capture can take, or reconciliation invents mismatches
  email:
    provider: ${EMAIL_PROVIDER:console} # console or resend
    from: ${EMAIL_FROM:AjoLedger <noreply@ajoledger.xyz>}
    resend-api-key: ${RESEND_API_KEY:}
    timeout-ms: ${EMAIL_TIMEOUT_MS:10000}
    max-attempts: ${EMAIL_MAX_ATTEMPTS:8} # with 30s doubling backoff, gives up after about an hour, inside Resend's 24h idempotency window
    retention-days: ${EMAIL_RETENTION_DAYS:30}
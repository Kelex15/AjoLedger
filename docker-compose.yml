services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ajoledger}
      POSTGRES_USER: ${POSTGRES_USER:-ajoledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ajoledger}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
